version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  # Keeps the pinned action SHAs in the workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
