name: Dependency audit

# Checks Cargo.lock against the RustSec advisory database when dependencies change and weekly,
# so newly published advisories are caught even when the code hasn't changed.
on:
  push:
    branches: [main]
    paths: ["Cargo.lock", "Cargo.toml", ".cargo/audit.toml"]
  pull_request:
    paths: ["Cargo.lock", "Cargo.toml", ".cargo/audit.toml"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit
        run: cargo audit
