name: Release

# Pushing a tag like v0.1.0 builds Zquig, attaches the .deb and the tarball to a GitHub release
# with SHA-256 checksums, and records a signed build-provenance attestation for the files.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    env:
      # Passed through the environment, never pasted into scripts, so a tag name can't inject commands.
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libxkbcommon-dev poppler-utils fonts-dejavu-core dpkg-dev

      - name: Install Rust and cargo-deb
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install cargo-deb --locked --version 3.8.0

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG doesn't match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Test
        run: cargo test --locked

      - name: Build and package
        run: ./package.sh

      - name: Check the package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - name: Checksums
        run: |
          cd dist
          sha256sum *.deb *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.tar.gz

      - name: Publish release
        run: gh release create "$TAG" dist/*.deb dist/*.tar.gz dist/SHA256SUMS.txt --title "Zquig $TAG" --generate-notes --verify-tag
